{{- $existing := lookup "v1" "Secret" .Release.Namespace "helm-e-secret" }}
apiVersion: v1
kind: Secret
metadata: { name: helm-e-secret }
type: Opaque
data:
  {{- if $existing }}
  apiKeyPepper: {{ index $existing.data "apiKeyPepper" }}
  {{- else }}
  apiKeyPepper: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
