apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: helm-e-deny }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: helm-e-allow-hook }
spec:
  podSelector: { matchLabels: { app: helm-e } }
  policyTypes: [Ingress]
  ingress: [ { from: [ { podSelector: { matchLabels: { role: hook } } } ] } ]
