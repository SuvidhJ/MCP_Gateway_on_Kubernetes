# E7: NetworkPolicy negative test in namespace exp.
# Expect: rogue -> upstream BLOCKED, rogue -> gateway BLOCKED, gateway -> upstream OK, Traefik -> gateway OK.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: exp }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: upstreams-from-gateway-only, namespace: exp }
spec:
  podSelector: { matchLabels: { role: upstream } }
  policyTypes: [Ingress]
  ingress:
    - from: [ { podSelector: { matchLabels: { role: gateway } } } ]
      ports: [ { port: 8080, protocol: TCP } ]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gateway-from-traefik-only, namespace: exp }
spec:
  podSelector: { matchLabels: { role: gateway } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [ { port: 8080, protocol: TCP } ]
---
apiVersion: v1
kind: Pod
metadata: { name: rogue, namespace: exp, labels: { role: rogue } }
spec:
  containers:
    - name: rogue
      image: urumi-spike:dev
      imagePullPolicy: Never
      command: ["node", "-e", "setInterval(() => {}, 1e9)"]
