# Minimal RBAC for the gateway's EndpointSlice watch (decision 13 option): read-only, namespace-scoped.
apiVersion: v1
kind: ServiceAccount
metadata: { name: spike-gateway, namespace: exp }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: endpointslice-reader, namespace: exp }
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: spike-gateway-endpointslice-reader, namespace: exp }
subjects: [ { kind: ServiceAccount, name: spike-gateway, namespace: exp } ]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: endpointslice-reader }
