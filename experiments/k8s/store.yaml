# E5: WordPress 7.1.3 + WooCommerce 11.2.0 + MariaDB 11.4 in-cluster, to verify Basic auth over in-cluster HTTP via
# X-Forwarded-Proto, the mcp_store_agent role under HPOS, REST shapes for the 5 tools, and store setup traps.
# Spike only: secrets inline, single replica.
apiVersion: v1
kind: Namespace
metadata: { name: store }
---
apiVersion: v1
kind: Secret
metadata: { name: store-db, namespace: store }
stringData: { root: rootpw-e5, user: wp, password: wppw-e5, database: wordpress }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mariadb, namespace: store }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mariadb, namespace: store }
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: mariadb } }
  template:
    metadata: { labels: { app: mariadb } }
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4.13
          imagePullPolicy: IfNotPresent
          env:
            - { name: MARIADB_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: store-db, key: root } } }
            - { name: MARIADB_DATABASE, valueFrom: { secretKeyRef: { name: store-db, key: database } } }
            - { name: MARIADB_USER, valueFrom: { secretKeyRef: { name: store-db, key: user } } }
            - { name: MARIADB_PASSWORD, valueFrom: { secretKeyRef: { name: store-db, key: password } } }
          ports: [ { containerPort: 3306 } ]
          readinessProbe: { exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }, periodSeconds: 5 }
          volumeMounts: [ { name: data, mountPath: /var/lib/mysql } ]
      volumes: [ { name: data, persistentVolumeClaim: { claimName: mariadb } } ]
---
apiVersion: v1
kind: Service
metadata: { name: mariadb, namespace: store }
spec: { selector: { app: mariadb }, ports: [ { port: 3306 } ] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: wp, namespace: store }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: wordpress, namespace: store }
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: wordpress } }
  template:
    metadata: { labels: { app: wordpress } }
    spec:
      containers:
        - name: wordpress
          image: wordpress:7.1.3-php8.4-apache
          imagePullPolicy: IfNotPresent
          env:
            - { name: WORDPRESS_DB_HOST, value: mariadb }
            - { name: WORDPRESS_DB_NAME, valueFrom: { secretKeyRef: { name: store-db, key: database } } }
            - { name: WORDPRESS_DB_USER, valueFrom: { secretKeyRef: { name: store-db, key: user } } }
            - { name: WORDPRESS_DB_PASSWORD, valueFrom: { secretKeyRef: { name: store-db, key: password } } }
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', 'http://store.127.0.0.1.nip.io:8080');
                define('WP_SITEURL', 'http://store.127.0.0.1.nip.io:8080');
          ports: [ { containerPort: 80 } ]
          readinessProbe: { httpGet: { path: /wp-includes/images/blank.gif, port: 80 }, periodSeconds: 5 }
          volumeMounts: [ { name: html, mountPath: /var/www/html } ]
      volumes: [ { name: html, persistentVolumeClaim: { claimName: wp } } ]
---
apiVersion: v1
kind: Service
metadata: { name: wordpress, namespace: store }
spec: { selector: { app: wordpress }, ports: [ { port: 80 } ] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: wordpress, namespace: store }
spec:
  rules:
    - host: store.127.0.0.1.nip.io
      http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: wordpress, port: { number: 80 } } } } ] }
