# Served straight from the immutable, root-owned code directory (the pod's root filesystem is read-only).
<Directory /usr/src/wordpress/>
  Options FollowSymLinks
  AllowOverride All
  Require all granted
</Directory>
# Uploads are the only writable web path: never execute anything there.
<Directory /usr/src/wordpress/wp-content/uploads/>
  php_admin_flag engine off
  <FilesMatch "\.(php|phtml|phar|pht|php\d)$">
    Require all denied
  </FilesMatch>
</Directory>
# Version disclosure and the unused XML-RPC endpoint (a password-guessing target): not served.
<FilesMatch "^(readme\.html|license\.txt|wp-config-sample\.php|xmlrpc\.php)$">
  Require all denied
</FilesMatch>
ServerName localhost
ServerTokens Prod
ServerSignature Off
