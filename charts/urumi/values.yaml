# Public hostnames (nip.io resolves *.127.0.0.1.nip.io to 127.0.0.1; k3d maps host :8080 -> ingress :80).
baseDomain: 127.0.0.1.nip.io
publicPort: 8080
ingressClassName: traefik

images:
  wordpress: urumi/wordpress:dev
  mariadb: mariadb:11.4.13
  postgres: postgres:18.6-alpine
  wooMcp: urumi/woo-mcp:dev
  demoUpstream: urumi/demo-upstream:dev
  gateway: urumi/gateway:dev
  pullPolicy: IfNotPresent

store:
  host: store            # -> store.<baseDomain>
  title: Urumi Store
  name: Urumi            # how MCP tool descriptions name the shop ("List products in the Urumi WooCommerce store")
  adminUser: admin
  adminEmail: admin@store.invalid
  timezone: Asia/Kolkata
  currency: INR
  country: "IN:KA"
  mcpUser: mcp-agent
  storageSize: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

mariadb:
  storageSize: 2Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }

# TLS on the Ingress (prod: a cert-manager or pre-made secret). Off locally.
tls:
  enabled: false
  secretName: urumi-tls

postgres:
  storageSize: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

gateway:
  host: gateway          # -> gateway.<baseDomain>; serves /mcp, /api and the dashboard
  adminEmail: admin@urumi.local
  callTimeoutMs: 30000   # default per-call upstream timeout (per-server override in the dashboard)
  # In-cluster hostnames the SSRF guard lets resolve to private addresses (everything else must be public).
  ssrfAllowHosts: [woo-mcp, demo-upstream]
  # Registered on first start only (afterwards the dashboard/DB is the source of truth).
  seedServers:
    - { slug: store, name: "Store (WooCommerce)", url: "http://woo-mcp/mcp" }
    - { slug: demo, name: "Demo upstream", url: "http://demo-upstream/mcp", timeoutMs: 10000 }
    - { slug: deepwiki, name: "DeepWiki", url: "https://mcp.deepwiki.com/mcp" }
  # Chat agent: any OpenAI-compatible endpoint. Local default: Ollama on the host (reachable from k3d pods).
  llm:
    baseUrl: http://host.k3d.internal:11434/v1
    model: qwen3.5-agent
    apiKey: ""
    reasoningEffort: none  # sent as reasoning_effort; "" to omit (for providers that reject it)
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# Ingress-only NetworkPolicies (default deny; upstream MCP servers reachable only from the gateway).
networkPolicy:
  enabled: true
  ingressNamespace: kube-system           # where the ingress controller runs (k3s: Traefik in kube-system)
  ingressPodLabels: { app.kubernetes.io/name: traefik }
