{{- $ns := .Release.Namespace -}}
apiVersion: v1
kind: Secret
metadata:
  name: store-db
  labels: {{- include "urumi.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  database: wordpress
  user: wp
  root: {{ include "urumi.secretValue" (dict "ns" $ns "name" "store-db" "key" "root" "gen" (randAlphaNum 32)) | quote }}
  password: {{ include "urumi.secretValue" (dict "ns" $ns "name" "store-db" "key" "password" "gen" (randAlphaNum 32)) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: store-app
  labels: {{- include "urumi.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  admin-password: {{ include "urumi.secretValue" (dict "ns" $ns "name" "store-app" "key" "admin-password" "gen" (randAlphaNum 24)) | quote }}
  # WooCommerce REST key for woo-mcp: ck_/cs_ + 40 hex = 43 chars (the shape WC itself generates).
  wc-ck: {{ include "urumi.secretValue" (dict "ns" $ns "name" "store-app" "key" "wc-ck" "gen" (printf "ck_%s" (sha1sum (randAlphaNum 40)))) | quote }}
  wc-cs: {{ include "urumi.secretValue" (dict "ns" $ns "name" "store-app" "key" "wc-cs" "gen" (printf "cs_%s" (sha1sum (randAlphaNum 40)))) | quote }}
  {{- range $k := list "AUTH_KEY" "SECURE_AUTH_KEY" "LOGGED_IN_KEY" "NONCE_KEY" "AUTH_SALT" "SECURE_AUTH_SALT" "LOGGED_IN_SALT" "NONCE_SALT" }}
  {{ $k }}: {{ include "urumi.secretValue" (dict "ns" $ns "name" "store-app" "key" $k "gen" (randAlphaNum 64)) | quote }}
  {{- end }}
