{{- $ns := .Release.Namespace -}}
apiVersion: v1
kind: Secret
metadata:
  name: gateway-db
  labels: {{- include "urumi.labels" . | nindent 4 }}
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  database: urumi
  user: urumi
  password: {{ include "urumi.secretValue" (dict "ns" $ns "name" "gateway-db" "key" "password" "gen" (randAlphaNum 32)) | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.postgres.storageSize }} } } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      securityContext: { fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - { name: POSTGRES_DB, valueFrom: { secretKeyRef: { name: gateway-db, key: database } } }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: gateway-db, key: user } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: gateway-db, key: password } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [ { containerPort: 5432, name: pg } ]
          readinessProbe: { exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""] }, periodSeconds: 20, initialDelaySeconds: 30 }
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts: [ { name: data, mountPath: /var/lib/postgresql/data } ]
      volumes: [ { name: data, persistentVolumeClaim: { claimName: postgres } } ]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec: { selector: { app: postgres }, ports: [ { port: 5432, targetPort: pg } ] }
