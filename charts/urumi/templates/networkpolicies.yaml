{{- if .Values.networkPolicy.enabled }}
{{- $ingressFrom := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .Values.networkPolicy.ingressNamespace)) "podSelector" (dict "matchLabels" .Values.networkPolicy.ingressPodLabels) -}}
# Ingress-only policies (verified in experiment E7: enforced ~1.3 s after apply, denials are ECONNREFUSED).
# Nothing in the namespace accepts traffic unless a rule below allows it. Upstream MCP servers accept calls only from
# the gateway, so the gateway's identity, authorization and audit cannot be bypassed from inside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-ingress
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: gateway } }
  policyTypes: [Ingress]
  ingress:
    - from: [ {{- toJson $ingressFrom }} ]
      ports: [ { port: 8080, protocol: TCP } ]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: upstreams-from-gateway-only
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec:
  podSelector: { matchExpressions: [ { key: app, operator: In, values: [woo-mcp, demo-upstream] } ] }
  policyTypes: [Ingress]
  ingress:
    - from: [ { podSelector: { matchLabels: { app: gateway } } } ]
      ports: [ { port: 8080, protocol: TCP } ]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-gateway
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from: [ { podSelector: { matchLabels: { app: gateway } } } ]
      ports: [ { port: 5432, protocol: TCP } ]
---
# The storefront is public (via the ingress); woo-mcp reaches the WooCommerce REST API in-cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress-from-ingress-and-woo-mcp
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: wordpress } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - {{ toJson $ingressFrom }}
        - podSelector: { matchLabels: { app: woo-mcp } }
      ports: [ { port: 80, protocol: TCP } ]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-from-wordpress
  labels: {{- include "urumi.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: mariadb } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchExpressions: [ { key: app, operator: In, values: [wordpress, store-bootstrap] } ] }
      ports: [ { port: 3306, protocol: TCP } ]
{{- end }}
